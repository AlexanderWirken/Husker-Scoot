<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Husker Scoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
  :root { --bg:#111; --fg:#eee; --accent:#d00000; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:"Press Start 2P", monospace; }
  #game {
    width:min(100vw, calc(100vh * 256 / 224));
    aspect-ratio:256 / 224;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000; display:block; outline:none;
  }
  #touch { position:fixed; inset:auto 0 0 0; display:none; justify-content:space-between; padding:12px 16px; pointer-events:none; }
  #touch .pad, #touch .btns { display:grid; gap:8px; pointer-events:auto; }
  #touch .pad { grid-template-columns:repeat(3,52px); grid-template-rows:repeat(3,52px); }
  #touch .btns { grid-template-columns:repeat(2,64px); align-items:end; }
  #touch button {
    font:10px "Press Start 2P", monospace; color:#fff; background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.4); border-radius:10px; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #touch .btns button { height:64px; border-radius:50%; background:rgba(208,0,0,.45); }
  #touch .small { height:40px !important; border-radius:8px !important; background:rgba(240,196,25,.35) !important; }
  #touch .start { grid-column:1 / span 2; height:32px !important; border-radius:8px !important; background:rgba(255,255,255,.15) !important; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<canvas id="game" width="256" height="224"></canvas>
<div id="touch">
  <div class="pad">
    <span></span><button data-k="up">▲</button><span></span>
    <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
    <span></span><button data-k="down">▼</button><span></span>
  </div>
  <div class="btns">
    <button class="small" data-k="mega">MEGA</button><button class="small" data-k="brake">BRAKE</button>
    <button data-k="b">TURBO</button><button data-k="a">GO</button>
    <button class="start" data-k="start">START / PAUSE</button>
  </div>
</div>
<script>

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; };

let course = COURSES[0];
const lp = x => ((x % course.lap) + course.lap) % course.lap;
const finishX = () => START_POS + course.dist;
const lockX = () => finishX() + LOCK_OFFSET;

function hAt(x) {
  if (x >= finishX() - 4) return 0;      // the lock-up zone is flat
  if (fountain && x > fountain.clearA && x < fountain.clearB) return 0; // fountain plaza is flat
  const p = lp(x);
  for (const r of course.ramps) {
    if (p >= r.x && p < r.x + r.len) {
      const d = p - r.x, pts = r.pts;
      for (let i = 1; i < pts.length; i++) {
        if (d <= pts[i][0]) {
          const a = pts[i - 1], b = pts[i];
          return a[1] + (b[1] - a[1]) * ((d - a[0]) / ((b[0] - a[0]) || 1));
        }
      }
    }
  }
  return 0;
}

function buildSprite(rows, pal) {
  const c = document.createElement('canvas'); c.width = 20; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const col = pal[row[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
  return c;
}
const BASEPAL = { V:'#1a1a2e', S:'#f2c29a', P:'#2b2b3a', B:'#111111', D:'#5cff8a', G:'#606a78', K:'#1b1b1b', L:'#c8c8c8' };
function riderSprites(H, J, N) { const pal = { ...BASEPAL, H, J, N }; return [buildSprite(RIDER, pal), buildSprite(RIDER2, pal)]; }
const PLAYER_SPR = riderSprites('#d00000', '#d00000', '#ffffff');

const SEQ = [['kiewit',204,kiewit],['tree',36,x=>tree(x,false)],['lamp',16,lamp],['stadium',228,stadium],['tree',36,x=>tree(x,false)],['tree',36,x=>tree(x,true)],['hawks',198,hawks],['lamp',16,lamp],['tree',36,x=>tree(x,true)],['brick',198,brickHall],['tree',36,x=>tree(x,false)],['lamp',20,lamp]];

let AC = null, motor = null, mgain = null, muted = false;
function initAudio() {

    mgain = AC.createGain(); mgain.gain.value = 0;

}

}

  motor.frequency.setTargetAtTime(90 + speed * 110 + (turbo ? 120 : 0), t, 0.06);

addEventListener('keydown', e => {

addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });

  }

    const eta = (fountain.x - player.x) / Math.max(player.speed, 1.6);

  txt('MEGA JUMP AHEAD!', 128, 31, blink ? '#ffe14a' : '#fff', 'center');
  if (!fountain.armed) {
    R(68, 42, 18, 12, blink ? '#ffe14a' : '#fff'); txt('C', 73, 44, '#000');
    txt('BOOST ' + Math.ceil(eta) + 's', 92, 44, '#fff');
    if ((frame >> 5) & 1) { R(44, 54, 168, 8, 'rgba(0,0,0,.9)'); txt('NEED ' + MEGA_MIN + '%+ BATT', 128, 54, player.batt >= MEGA_MIN ? '#a6ff6b' : '#ff8080', 'center'); }
  } else {
    txt('ARMED ' + Math.round(fountain.p * 100) + '%', 128, 44, fountain.p * 100 >= MEGA_MIN ? '#a6ff6b' : '#ff8080', 'center');
    if (fountain.p * 100 < MEGA_MIN) txt('TOO WEAK!', 128, 54, '#ff5050', 'center');
  }
}
function drawBattery(x, y, pct) {
  R(x, y, 74, 10, '#cfcfcf'); R(x + 74, y + 3, 3, 4, '#cfcfcf'); R(x + 1, y + 1, 72, 8, '#111');
  const segs = Math.ceil(pct / 12.5);
  const col = pct > 50 ? '#40d060' : pct > 20 ? '#ffd040' : ((frame >> 3) & 1 ? '#ff2020' : '#7a1010');
  for (let i = 0; i < segs; i++) R(x + 2 + i * 9, y + 2, 8, 6, col);
  if (pct <= 0 && (frame >> 4) & 1) txt('EMPTY', x + 17, y + 1, '#ff5050');
}
function drawHUD() {
  R(0, 206, W, 18, '#000'); R(0, 206, W, 1, '#d00000');
  txt(fmt(raceT), 4, 211, '#fff');
  if (state === 'lock' || state === 'finish') txt('LOCK!', 80, 211, (frame >> 3) & 1 ? '#9fd0ff' : '#fff');
  else { const lap = clamp(Math.floor((player.x - START_POS) / course.lap) + 1, 1, course.laps); txt('LAP' + lap + '/' + course.laps, 76, 211, '#ffd040'); }
  txt('BATT', 136, 211, '#a6ff6b');
  drawBattery(171, 210, player.batt);
  txt('COURSE ' + (selCourse + 1), 4, 4, '#fff');
  txt('QUALIFY ' + fmt(course.qualify), 4, 14, '#ffd040');
  const best = loadBest(selCourse);
  txt('BEST ' + (best ? fmt(best) : '-:--.--'), 252, 4, '#fff', 'right');
  if (mode === 1) txt('RIVALS', 252, 14, '#9fd0ff', 'right');
}
function drawLights() {
  const n = Math.ceil(readyT / 60);
  const x = 104;
  R(x - 2, 44, 52, 18, '#111'); R(x - 2, 44, 52, 1, '#555');
  for (let i = 0; i < 3; i++) {
    const on = (3 - i) >= n;
    R(x + 2 + i * 16, 48, 12, 10, on ? (i === 2 && n <= 1 ? '#40ff60' : '#ff3030') : '#402020');
  }
  txt(String(n), 128, 70, '#fff', 'center', 16);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  if (state === 'results') { drawResults(); return; }
  drawScene();
  const ents = [...walkers.map(w => ({ y: LANE_Y[w.lane], w })), ...[player, ...rivals].map(r => ({ y: r.y, r }))].sort((a, b) => a.y - b.y);
  for (const e of ents) e.w ? drawWalker(e.w) : drawRider(e.r);
  for (const p of particles) R(p.x - camX, p.y, 1, 1, p.col);
  drawHUD();
  drawMegaPrompt();
  if (state === 'ready') drawLights();
  if (player.chg && player.chg.ph === 'charge') {
    R(72, 64, 112, 32, 'rgba(0,0,0,.75)'); R(72, 64, 112, 1, '#5cff8a');
    txt('CHARGING', 128, 69, '#a6ff6b', 'center');
    txt(String(Math.ceil(player.chg.t / 60)), 128, 82, '#fff', 'center');
  } else if (player.chg && player.chg.ph === 'walk') {
    txt('TO THE CHARGER >', 128, 74, (frame >> 3) & 1 ? '#a6ff6b' : '#fff', 'center');
  }
  if (state === 'lock') {
    R(78, 30, 100, 30, 'rgba(0,0,0,.7)'); R(78, 30, 100, 1, '#1e5bd8');
    txt('LOCK UP', 128, 34, '#9fd0ff', 'center');
    txt((Math.max(0, lockT) / 60).toFixed(1), 128, 46, lockT < 120 && (frame >> 2) & 1 ? '#ff5050' : '#fff', 'center');
    if (lockX() - camX > W - 4 && (frame >> 3) & 1) txt('>', W - 10, LANE_Y[course.lockLane] - 10, '#f0c419');
  }
  if (msg && !(player.chg && player.chg.ph !== 'return' && msg.t < 40)) txt(msg.text, 128, state === 'lock' || (fountain && fountain.prompted && !fountain.launched && player.x < fountain.x) ? 70 : 52, (frame >> 3) & 1 ? msg.col : '#fff', 'center');
  if (paused) drawPause();
}
function drawPause() {
  R(28, 34, 200, 150, 'rgba(10,10,20,.9)'); R(28, 34, 200, 2, '#d00000'); R(28, 182, 200, 2, '#d00000');
  txt('PAUSED', 128, 42, '#fff', 'center');
  const rows = [['SPACE', 'GO'], ['X', 'TURBO'], ['C', 'MEGA BOOST'], ['Z', 'BRAKE'], ['UP/DN', 'CHANGE LANE'], ['L/R', 'LEAN / WALK'],
                ['ENTER', 'RESUME'], ['ESC', 'QUIT'], ['M', muted ? 'SOUND ON' : 'MUTE']];
  rows.forEach(([k, a], i) => { txt(k, 100, 60 + i * 13, '#ffd040', 'right'); txt(a, 110, 60 + i * 13, '#ddd'); });
}
function drawTitle() {
  course = COURSES[selCourse];
  drawScene();
  R(16, 26, 224, 156, 'rgba(10,10,20,0.82)');
  R(16, 26, 224, 2, '#d00000'); R(16, 180, 224, 2, '#d00000');
  txt('HUSKER', 128, 34, '#d00000', 'center', 16);
  txt('SCOOT', 128, 54, '#ffffff', 'center', 16);
  txt('CAMPUS E-SCOOTER RALLY', 128, 76, '#ffd040', 'center');
  const items = ['SOLO TIME TRIAL', 'RIVAL RACE'];
  items.forEach((s, i) => { txt((mode === i ? '> ' : '  ') + s, 40, 90 + i * 11, mode === i ? '#fff' : '#888'); });
  txt(COURSES[selCourse].name, 128, 121, '#9fd0ff', 'center');
  txt('4 LAPS, THEN LOCK UP IN 7s', 128, 138, '#a6ff6b', 'center');
  txt('FOUNTAIN AHEAD? PRESS C', 128, 150, '#7fe8ff', 'center');
  txt('TO BURN BATTERY & FLY IT!', 128, 159, '#7fe8ff', 'center');
  if ((frame >> 5) & 1) txt('PRESS ENTER', 128, 170, '#ffd040', 'center');
  R(0, 184, W, 40, 'rgba(0,0,0,.85)');
  txt('SPACE GO  X TURBO  C MEGA', 128, 190, '#ddd', 'center');
  txt('UP/DN LANE   Z BRAKE', 128, 200, '#ddd', 'center');
  txt('L/R LEAN   ENTER PAUSE', 128, 210, '#888', 'center');
}
function drawResults() {
  drawScene();
  R(24, 40, 208, 132, 'rgba(10,10,20,0.88)');
  R(24, 40, 208, 2, '#d00000'); R(24, 170, 208, 2, '#d00000');
  const ri = resultInfo;
  txt('COURSE ' + (selCourse + 1) + ' RESULTS', 128, 50, '#fff', 'center');
  txt('TIME    ' + (ri.locked ? fmt(ri.t) : '-:--.--'), 44, 72, '#fff');
  txt('QUALIFY ' + fmt(course.qualify), 44, 86, '#ffd040');
  txt('BEST    ' + (ri.best ? fmt(ri.best) : '-:--.--'), 44, 100, '#9fd0ff');
  if (ri.rec && (frame >> 4) & 1) txt('NEW RECORD!', 128, 116, '#ff5050', 'center');
  if (!ri.locked) txt('SCOOTER NOT LOCKED!', 128, 116, '#ff8080', 'center');
  txt(ri.q ? 'YOU QUALIFIED!' : 'NOT FAST ENOUGH', 128, 130, ri.q ? '#40ff60' : '#ff8080', 'center');
  txt(ri.q ? 'ENTER: NEXT COURSE' : 'ENTER: TRY AGAIN', 128, 148, '#fff', 'center');
  txt('ESC: TITLE', 128, 158, '#888', 'center');
}

/* ---------------- loop ---------------- */
let last = performance.now(), accum = 0;
const STEP = 1000 / 60;
function loop(now) {
  accum += Math.min(100, now - last); last = now;
  while (accum >= STEP) { update(); accum -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
(document.fonts && document.fonts.load ? document.fonts.load(FONT).catch(() => {}) : Promise.resolve())
  .then(() => { player = makeRider(START_POS, 1, PLAYER_SPR, false, 2.4, 3.2); requestAnimationFrame(loop); });
</script>
